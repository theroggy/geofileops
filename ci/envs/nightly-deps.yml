name: geofileops-nightly-deps
channels:
  - gdal-master
  - conda-forge
dependencies:
  - python
  - pip
  # required
  - cloudpickle
  - gdal
  - geopandas-base =1.0
  - libspatialite
  # - nomkl  # Use openblas instead of mkl saves 600 MB. Linux OK, 50% slower on Windows and OSX!
  - numpy
  - packaging
  - pandas
  - psutil
  - pygeoops
  # pyogrio from conda-forge is built against an older libgdal soname than the
  # gdal-master channel provides, so in the test workflow pyogrio is rebuilt from
  # source against the installed gdal (the gdal package provides gdal-config and
  # headers needed for that).
  - pyogrio
  - pyproj
  - shapely >=2
  # optional
  - pyarrow-core
  - simplification
  # testing
  - pytest
  - pytest-cov
  - pytest-xdist
  - pip:
    - --pre --index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple --extra-index-url https://pypi.fury.io/arrow-nightlies/ --extra-index-url https://pypi.org/simple
    - geopandas >=1.1
